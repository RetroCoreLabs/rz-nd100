name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rizin from RizinOrg repository
        run: |
          echo 'deb http://download.opensuse.org/repositories/home:/RizinOrg/xUbuntu_22.04/ /' | sudo tee /etc/apt/sources.list.d/home:RizinOrg.list
          curl -fsSL https://download.opensuse.org/repositories/home:RizinOrg/xUbuntu_22.04/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/home_RizinOrg.gpg > /dev/null
          sudo apt-get update
          sudo apt-get install -y rizin librizin-dev

      - name: Install build tools
        run: sudo apt-get install -y meson ninja-build gcc pkg-config

      - name: Configure
        run: meson setup build

      - name: Build
        run: ninja -C build

      - name: Verify build output
        run: |
          echo "=== Built plugins ==="
          ls -la build/*.so

      - name: Install plugins
        run: |
          PLUGDIR=$(pkg-config --variable=plugindir rz_core)
          INSTALL_DIR="${DESTDIR:-}$(pkg-config --variable=prefix rz_core)/$PLUGDIR"
          sudo mkdir -p "$INSTALL_DIR"
          sudo cp build/*.so "$INSTALL_DIR/"
          echo "Installed to $INSTALL_DIR"
          ls -la "$INSTALL_DIR"/*nd100* "$INSTALL_DIR"/*bpun* "$INSTALL_DIR"/*aout16* "$INSTALL_DIR"/*parse_nd100* 2>/dev/null || true

      - name: Verify plugins load
        run: |
          rz-asm -L | grep nd100
          rizin -qc 'iL' /dev/null 2>/dev/null | grep -E 'bpun|aout16' || echo "bin plugins loaded via rizin"

      - name: Test assembler round-trip
        run: |
          pass=0; fail=0
          for test in \
            "LDA 0" "LDA ,B -4" "LDA I 0" "LDA ,X ,B 10" \
            "STA 0" "JMP 0" "JPL ,B 10" "JAP 10" \
            "MON 101" "IOX 10" "EXIT" "LEAVE" \
            "SKP IF DA GRE SA" "RADD CLD SA DA" \
            "SHT SHR 4" "SHT ROT 4" "BSKP ONE 10 DA" \
            "BSET ZRO SSPTM" "BSTC 10 DA" "IDENT PL10" \
            "EXR SA" "IRW 10 DA" "RCLR DA" "RINC DA" \
            "LDATX" "STATX" "ROP NOOP"; do
            hex=$(rz-asm -a nd100 "$test" 2>/dev/null)
            dis=$(rz-asm -a nd100 -d "$hex" 2>/dev/null | sed 's/ *;.*//')
            rehex=$(rz-asm -a nd100 "$dis" 2>/dev/null)
            if [ "$hex" = "$rehex" ]; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
              echo "FAIL: '$test' -> $hex -> '$dis' -> $rehex"
            fi
          done
          echo "Round-trip: $pass passed, $fail failed"
          [ "$fail" -eq 0 ] || exit 1

      - name: Package Linux plugins
        run: |
          mkdir -p dist
          cp build/*.so dist/
          cd dist && tar czf ../rz-nd100-linux.tar.gz *.so

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rz-nd100-linux
          path: rz-nd100-linux.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: |
          pip install meson ninja
          choco install pkgconfiglite -y
        shell: cmd

      - name: Download Rizin release
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/rizinorg/rizin/releases/download/v0.8.2/rizin-windows-shared64-v0.8.2.zip" -OutFile rizin.zip
          Expand-Archive -Path rizin.zip -DestinationPath rizin-release
          $rizinRoot = (Get-ChildItem rizin-release -Directory | Select-Object -First 1).FullName
          Write-Host "Rizin root: $rizinRoot"
          echo "RIZIN_ROOT=$rizinRoot" >> $env:GITHUB_ENV
          echo "$rizinRoot\bin" >> $env:GITHUB_PATH

      - name: Fix pkg-config files
        shell: powershell
        run: |
          $pcDir = "$env:RIZIN_ROOT\lib\pkgconfig"
          $rizinPrefix = $env:RIZIN_ROOT -replace '\\', '/'
          Get-ChildItem "$pcDir\rz_*.pc" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace '(?m)^prefix=.*', "prefix=$rizinPrefix"
            Set-Content $_.FullName $content -NoNewline
          }
          Write-Host "Fixed prefix in .pc files to: $rizinPrefix"
          echo "PKG_CONFIG_PATH=$pcDir" >> $env:GITHUB_ENV

      - name: Configure
        shell: cmd
        run: meson setup build

      - name: Build
        shell: cmd
        run: ninja -C build

      - name: Verify build output
        shell: cmd
        run: |
          echo === Built plugins ===
          dir build\*.dll

      - name: Install and verify plugins
        shell: cmd
        run: |
          if not exist "%RIZIN_ROOT%\lib\plugins" mkdir "%RIZIN_ROOT%\lib\plugins"
          for %%f in (build\*.dll) do copy /Y "%%f" "%RIZIN_ROOT%\lib\plugins\"
          rz-asm -L | findstr nd100

      - name: Test assembler round-trip
        shell: powershell
        run: |
          $tests = @("LDA 0", "LDA ,B -4", "STA 0", "JMP 0",
                     "MON 101", "EXIT", "RADD CLD SA DA",
                     "BSKP ONE 10 DA", "LDATX", "ROP NOOP")
          $pass = 0; $fail = 0
          foreach ($test in $tests) {
            $hex = & rz-asm -a nd100 $test 2>$null
            $dis = (& rz-asm -a nd100 -d $hex 2>$null) -replace '\s*;.*', ''
            $rehex = & rz-asm -a nd100 $dis 2>$null
            if ($hex -eq $rehex) { $pass++ } else {
              $fail++
              Write-Host "FAIL: '$test' -> $hex -> '$dis' -> $rehex"
            }
          }
          Write-Host "Round-trip: $pass passed, $fail failed"
          if ($fail -ne 0) { exit 1 }

      - name: Package Windows plugins
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\*.dll dist\

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rz-nd100-windows
          path: dist/*.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rz-nd100-linux
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rz-nd100-windows
          path: win-plugins/

      - name: Package Windows plugins
        run: |
          cd win-plugins && zip ../release/rz-nd100-windows.zip *.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/rz-nd100-linux.tar.gz
            release/rz-nd100-windows.zip
