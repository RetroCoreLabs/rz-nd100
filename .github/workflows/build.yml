name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rizin from RizinOrg repository
        run: |
          echo 'deb http://download.opensuse.org/repositories/home:/RizinOrg/xUbuntu_22.04/ /' | sudo tee /etc/apt/sources.list.d/home:RizinOrg.list
          curl -fsSL https://download.opensuse.org/repositories/home:RizinOrg/xUbuntu_22.04/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/home_RizinOrg.gpg > /dev/null
          sudo apt-get update
          sudo apt-get install -y rizin librizin-dev

      - name: Install build tools
        run: sudo apt-get install -y meson ninja-build gcc pkg-config

      - name: Configure
        run: meson setup build

      - name: Build
        run: ninja -C build

      - name: Verify build output
        run: |
          echo "=== Built plugins ==="
          ls -la build/*.so

      - name: Install plugins
        run: |
          PLUGDIR=$(pkg-config --variable=plugindir rz_core)
          INSTALL_DIR="${DESTDIR:-}$(pkg-config --variable=prefix rz_core)/$PLUGDIR"
          sudo mkdir -p "$INSTALL_DIR"
          sudo cp build/*.so "$INSTALL_DIR/"
          echo "Installed to $INSTALL_DIR"
          ls -la "$INSTALL_DIR"/*nd100* "$INSTALL_DIR"/*bpun* "$INSTALL_DIR"/*aout16* "$INSTALL_DIR"/*parse_nd100* 2>/dev/null || true

      - name: Verify plugins load
        run: |
          rz-asm -L | grep nd100
          rizin -qc 'iL' /dev/null 2>/dev/null | grep -E 'bpun|aout16' || echo "bin plugins loaded via rizin"

      - name: Test assembler round-trip
        run: |
          pass=0; fail=0
          for test in \
            "LDA 0" "LDA ,B -4" "LDA I 0" "LDA ,X ,B 10" \
            "STA 0" "JMP 0" "JPL ,B 10" "JAP 10" \
            "MON 101" "IOX 10" "EXIT" "LEAVE" \
            "SKP IF DA GRE SA" "RADD CLD SA DA" \
            "SHT SHR 4" "SHT ROT 4" "BSKP ONE 10 DA" \
            "BSET ZRO SSPTM" "BSTC 10 DA" "IDENT PL10" \
            "EXR SA" "IRW 10 DA" "RCLR DA" "RINC DA" \
            "LDATX" "STATX" "ROP NOOP"; do
            hex=$(rz-asm -a nd100 "$test" 2>/dev/null)
            dis=$(rz-asm -a nd100 -d "$hex" 2>/dev/null | sed 's/ *;.*//')
            rehex=$(rz-asm -a nd100 "$dis" 2>/dev/null)
            if [ "$hex" = "$rehex" ]; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
              echo "FAIL: '$test' -> $hex -> '$dis' -> $rehex"
            fi
          done
          echo "Round-trip: $pass passed, $fail failed"
          [ "$fail" -eq 0 ] || exit 1

      - name: Package Linux plugins
        run: |
          mkdir -p dist
          cp build/*.so dist/
          cd dist && tar czf ../rz-nd100-linux-x86_64.tar.gz *.so

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rz-nd100-linux
          path: rz-nd100-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            unzip

      - name: Download and install Rizin release
        run: |
          set -e
          curl -Lo rizin.zip https://github.com/rizinorg/rizin/releases/download/v0.8.0/rizin-windows-shared64-v0.8.0.zip
          unzip -q rizin.zip -d rizin-release
          echo "=== Rizin release contents ==="
          ls rizin-release/
          # Find the actual root dir inside the zip
          RIZIN_ROOT=$(ls -d rizin-release/*/ | head -1)
          echo "Rizin root: $RIZIN_ROOT"
          # Copy into MINGW64 prefix so pkg-config finds it
          cp -r "$RIZIN_ROOT"/* /mingw64/
          # Verify
          echo "=== pkg-config check ==="
          pkg-config --modversion rz_core || echo "pkg-config failed, checking structure..."
          ls /mingw64/include/librz/ 2>/dev/null | head -5 || true
          ls /mingw64/lib/pkgconfig/rz_*.pc 2>/dev/null || true
          rizin -v || true

      - name: Configure
        run: meson setup build

      - name: Build
        run: ninja -C build

      - name: Verify build output
        run: |
          echo "=== Built plugins ==="
          ls -la build/*.dll

      - name: Install plugins
        run: |
          PLUGDIR=$(pkg-config --variable=plugindir rz_core)
          PREFIX=$(pkg-config --variable=prefix rz_core)
          INSTALL_DIR="$PREFIX/$PLUGDIR"
          mkdir -p "$INSTALL_DIR"
          cp build/*.dll "$INSTALL_DIR/"
          echo "Installed to $INSTALL_DIR"

      - name: Verify plugins load
        run: |
          output=$(rz-asm -L 2>/dev/null | grep nd100 || true)
          echo "$output"
          echo "$output" | grep -q nd100

      - name: Test assembler round-trip
        run: |
          pass=0; fail=0
          for test in \
            "LDA 0" "LDA ,B -4" "STA 0" "JMP 0" \
            "MON 101" "EXIT" "RADD CLD SA DA" \
            "BSKP ONE 10 DA" "LDATX" "ROP NOOP"; do
            hex=$(rz-asm -a nd100 "$test" 2>/dev/null)
            dis=$(rz-asm -a nd100 -d "$hex" 2>/dev/null | sed 's/ *;.*//')
            rehex=$(rz-asm -a nd100 "$dis" 2>/dev/null)
            if [ "$hex" = "$rehex" ]; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
              echo "FAIL: '$test' -> $hex -> '$dis' -> $rehex"
            fi
          done
          echo "Round-trip: $pass passed, $fail failed"
          [ "$fail" -eq 0 ] || exit 1

      - name: Package Windows plugins
        run: |
          mkdir -p dist
          cp build/*.dll dist/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rz-nd100-windows
          path: dist/*.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rz-nd100-linux
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rz-nd100-windows
          path: win-plugins/

      - name: Package Windows plugins
        run: |
          cd win-plugins && zip ../release/rz-nd100-windows-x86_64.zip *.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/rz-nd100-linux-x86_64.tar.gz
            release/rz-nd100-windows-x86_64.zip
